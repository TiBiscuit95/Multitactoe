<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="accueil.css">
    <title>Accueil</title>
</head>
<body>
    <h1>Bienvenue sur la page d'accueil</h1>
    <h2 class="pseudo">pseudo</h2>
    <div class="square-container">
        <div class="square-wrapper">
            <span class="square-text">Partie jouée</span>
            <div class="square" id="square1"></div>
        </div>
        <div class="square-wrapper">
            <span class="square-text">Victoires</span>
            <div class="square" id="square2"></div>
        </div>
        <div class="square-wrapper">
            <span class="square-text">Matchs nuls</span>
            <div class="square" id="square3"></div>
        </div>
        <div class="square-wrapper">
            <span class="square-text">Défaites</span>
            <div class="square" id="square4"></div>
        </div>
    </div>
    <div class="buttons-container">
        <button type="submit" id="signout" value="signout" class="signout">Se déconnecter</button>
        <button type="button" id="jouer" class="jouer">Jouer</button>
        <button type="button" id="replay" class="replay">Replay</button>
    </div>
    <p>Ce projet à été réaliser dans le cadre de notre première année d'apprentissage à l'ORIF de Vaulruz en 2024</p>
    <script src="accueil.js"></script>
</body>
</html>
