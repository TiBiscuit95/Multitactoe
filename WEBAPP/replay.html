<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replay</title>
    <link rel="stylesheet" href="replay.css">
    <script src="replay.js"></script>
</head>
<body>
    <h1>Replay</h1>
    <div class="replay-container">
        <option value="default">sélectionnez une partie</option>
        <select id="dynamic-select" class="dynamic-select">
        </select>
    </div>
    <div class="container-cases">
        <div class="case" id="case1"></div>
        <div class="case" id="case2"></div>
        <div class="case" id="case3"></div>
        <div class="case" id="case4"></div>
        <div class="case" id="case5"></div>
        <div class="case" id="case6"></div>
        <div class="case" id="case7"></div>
        <div class="case" id="case8"></div>
        <div class="case" id="case9"></div>
    </div>
    <div class="bouton-coups">
        <button class="suivant">Suivant</button>
        <button class="precedent">Précédent</button>
    </div>
    <div class="buttons-container">
    <button type="button" class="accueil" id="accueil">Accueil</button>
    <button type="submit" id="signout" value="signout" class="signout">Se déconnecter</button>
    </div>
</body>
</html>
